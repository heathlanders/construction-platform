server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Correct MIME so Android treats it as an installable package
    location ~ \.apk$ {
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="thejobsite.apk"';
        add_header Cache-Control "no-store";   # always serve the freshest file
    }

    # Page + version label must always reflect the latest published build
    location = / {
        add_header Cache-Control "no-store";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /version.txt {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
